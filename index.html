<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Рулетка проектов — Казино Edition</title>
<style>
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top,#2a2f3a,#0d0f14);color:#e5e7eb;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{width:min(960px,95vw)}
h1{text-align:center;letter-spacing:3px;text-transform:uppercase;color:#fbbf24;text-shadow:0 0 12px #f59e0b88}
.inputs{display:flex;gap:12px;flex-wrap:wrap}
.inputs div{flex:1;min-width:220px}
label{display:block;margin-bottom:6px;font-size:13px;text-transform:uppercase;color:#9ca3af}
input{width:100%;box-sizing:border-box;padding:12px;background:#1f232b;border:1px solid #3a404c;color:#fff;border-radius:6px;font-size:16px}
.case{position:relative;margin-top:28px;height:170px;overflow:hidden;background:#15181e;border:2px solid #3a404c;border-radius:8px;box-shadow:inset 0 0 40px #000}
.case:before,.case:after{content:"";position:absolute;top:0;bottom:0;width:120px;z-index:2;pointer-events:none}
.case:before{left:0;background:linear-gradient(90deg,#15181e,transparent)}.case:after{right:0;background:linear-gradient(-90deg,#15181e,transparent)}
.marker{position:absolute;left:50%;top:0;bottom:0;width:3px;background:#fbbf24;z-index:3;transform:translateX(-50%);box-shadow:0 0 10px #fbbf24}
.marker:before,.marker:after{content:"";position:absolute;left:-7px;border:8px solid transparent}
.marker:before{top:0;border-top-color:#fbbf24}.marker:after{bottom:0;border-bottom-color:#fbbf24}
#strip{display:flex;position:absolute;top:10px;left:0;will-change:transform}
.item{width:150px;height:146px;margin-right:6px;flex:none;background:linear-gradient(180deg,#2b303a,#1b1e25);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-bottom:6px solid;box-sizing:border-box;text-align:center;padding:6px;overflow:hidden}
.item .avatar-box{width:64px;height:64px;border-radius:50%;overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.5)}
.item img{width:100%;height:100%;object-fit:cover}
.item .nm{font-weight:bold;margin-top:8px;font-size:14px;word-break:break-word;line-height:1.2}
button{display:block;margin:24px auto 0;padding:16px 48px;font-size:20px;font-weight:bold;text-transform:uppercase;border:none;border-radius:6px;background:linear-gradient(#4ade80,#16a34a);color:#06210f;cursor:pointer;box-shadow:0 0 20px #16a34a88;transition:.2s}
button:hover{filter:brightness(1.1)}
button:disabled{filter:grayscale(1);opacity:.6;cursor:not-allowed}
#result{margin:24px auto 0;text-align:center;font-size:24px;min-height:34px}
#result b{font-size:34px}
canvas{position:fixed;inset:0;pointer-events:none;z-index:10}

/* Модальное окно с мемом */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(5px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  opacity:0;
  pointer-events:none;
  transition:opacity .35s ease;
}
.modal-overlay.active{
  opacity:1;
  pointer-events:auto;
}
.modal-content{
  background:#11141a;
  border:2px solid #ef4444;
  border-radius:12px;
  padding:16px;
  box-shadow:0 0 40px #ef444466;
  position:relative;
  max-width:90vw;
  transform:scale(.92);
  transition:transform .35s ease;
}
.modal-overlay.active .modal-content{
  transform:scale(1);
}
.modal-content video{display:block;max-width:640px;width:100%;max-height:65vh;border-radius:8px;background:#000}
.close-btn{position:absolute;top:-14px;right:-14px;background:#ef4444;color:#fff;border:none;width:32px;height:32px;border-radius:50%;font-size:18px;font-weight:bold;cursor:pointer;box-shadow:0 0 10px #ef4444;transition:transform .2s}
.close-btn:hover{transform:scale(1.1)}
</style>
</head>
<body>
<div class="wrap">
<h1>🎰 Рулетка проектов: Казино Edition</h1>
<div class="inputs">
<div><label>Номер проекта</label><input id="proj" placeholder="например, 2026-15"></div>
<div style="flex:2"><label>Фамилии через запятую</label><input id="names" placeholder="Иванов, Петров, Сидоров"></div>
</div>
<div class="case"><div class="marker"></div><div id="strip"></div></div>
<button id="go">Крутить барабан</button>
<div id="result"></div>
</div>

<canvas id="c"></canvas>

<!-- Видеомодалка -->
<div class="modal-overlay" id="videoModal">
  <div class="modal-content">
    <button class="close-btn" id="closeModal">✕</button>
    <video id="memeVideo" playsinline muted preload="auto">
      <source src="https://raw.githubusercontent.com/adonskih1499-cloud/56656/main/videoplayback.mp4" type="video/mp4">
      Ваш браузер не поддерживает встроенное видео.
    </video>
  </div>
</div>

<script>
const R=[['#4b69ff','Обычный мем'],['#8847ff','Запрещённый'],['#d32ce6','Засекреченный'],['#eb4b4b','Тайный'],['#e4ae39','★ Легендарный']];

// Набор мемов: собака Доге + 4 картинки из вашего репозитория GitHub (через raw CDN)
const MEMES=[
  'https://upload.wikimedia.org/wikipedia/en/5/5f/Original_Doge_meme.jpg',
  'https://raw.githubusercontent.com/adonskih1499-cloud/56656/main/%D0%B4%D0%B5%D0%B4%20%D0%B1%D0%BE%D0%BCJPG.JPG',
  'https://raw.githubusercontent.com/adonskih1499-cloud/56656/main/%D0%A1%D1%82%D1%83%D0%BF%D0%B0.JPG',
  'https://raw.githubusercontent.com/adonskih1499-cloud/56656/main/%D0%95%D0%B1%D0%B0%D0%BD.JPG',
  'https://raw.githubusercontent.com/adonskih1499-cloud/56656/main/%D0%91%D0%BE%D0%BB%D0%BE%D1%82%D0%BD%D0%B8%D0%BA.JPG'
];

const strip=document.getElementById('strip'),res=document.getElementById('result'),b=document.getElementById('go');
const modal=document.getElementById('videoModal'),video=document.getElementById('memeVideo'),closeBtn=document.getElementById('closeModal');
const W=156,N=60,WIN=52;

// Отдельный аудиотрек для озвучки мема
const memeAudio = new Audio('https://raw.githubusercontent.com/adonskih1499-cloud/56656/main/videoplayback.weba');
memeAudio.preload = 'auto';

function card(name,rar){
  const e=document.createElement('div');
  e.className='item';
  e.style.borderColor=rar[0];
  e.style.boxShadow='inset 0 -40px 40px -30px '+rar[0];
  const memeUrl=MEMES[Math.floor(Math.random()*MEMES.length)];
  e.innerHTML='<div class="avatar-box"><img src="'+memeUrl+'" alt="meme" loading="lazy"></div><div class="nm" style="color:'+rar[0]+'">'+name+'</div>';
  return e;
}

function rr(){const x=Math.random();return R[x<.6?0:x<.82?1:x<.94?2:x<.985?3:4]}

function build(n,w){
  strip.innerHTML='';strip.style.transition='none';strip.style.transform='translateX(0)';
  for(let i=0;i<N;i++)strip.appendChild(card(i===WIN?w:n[Math.floor(Math.random()*n.length)],i===WIN?R[4]:rr()));
}

b.onclick=()=>{
  const n=document.getElementById('names').value.split(',').map(s=>s.trim()).filter(Boolean);
  if(!n.length){alert('Впишите фамилии');return}
  const p=document.getElementById('proj').value.trim();

  // Исключаем любые вариации фамилии Донских независимо от регистра, пробелов и инициалов
  const isDonskikh = (str) => /д[оo]нск/i.test(str);
  const allowedWinners = n.filter(name => !isDonskikh(name));
  const pool = allowedWinners.length ? allowedWinners : n;
  const w = pool[Math.floor(Math.random() * pool.length)];
  
  // Разблокировка Audio Context и прогрев аудио при прямом клике пользователя (Autoplay Policy)
  ctx();
  memeAudio.volume = 1.0;
  memeAudio.play().then(()=>{
    memeAudio.pause();
    memeAudio.currentTime = 0;
  }).catch(()=>{});

  video.muted = true; // Видео безмолвно синхронизируется с аудиотреком
  video.load();

  b.disabled=true;res.innerHTML='';build(n,w);
  const cw=document.querySelector('.case').clientWidth;
  const off=WIN*W+75-cw/2+(Math.random()-.5)*120;
  
  strip.offsetWidth;
  strip.style.transition='transform 7s cubic-bezier(.08,.6,.12,1)';
  strip.style.transform='translateX(-'+off+'px)';
  
  let last=-1;const t0=performance.now();
  (function watch(){
    const m=new DOMMatrix(getComputedStyle(strip).transform);
    const idx=Math.floor((-m.m41+cw/2)/W);
    if(idx!==last){last=idx;tick()}
    if(performance.now()-t0<7000)requestAnimationFrame(watch);
  })();
  
  setTimeout(()=>{
    res.innerHTML=(p?'Проект №'+p+'<br>':'')+'Исполнитель: <b style="color:#e4ae39">'+w+'</b> 🎉';
    fanfare();confetti();b.disabled=false;
    
    // Синхронный запуск видео и аудио
    setTimeout(()=>{
      modal.classList.add('active');
      video.currentTime = 0;
      memeAudio.currentTime = 0;
      memeAudio.volume = 1.0;
      video.play().catch(e=>console.log('Video error:', e));
      memeAudio.play().catch(e=>console.log('Audio error:', e));
    }, 600);
  },7100);
};

// Функция закрытия окна и остановки воспроизведения
function stopVideo(){
  modal.classList.remove('active');
  video.pause();
  video.currentTime = 0;
  memeAudio.pause();
  memeAudio.currentTime = 0;
}

// Автоматическое закрытие по окончании видео или звука
video.addEventListener('ended', stopVideo);
memeAudio.addEventListener('ended', stopVideo);

// Закрытие по кнопке крестика или клику мимо окна
closeBtn.onclick = stopVideo;
modal.onclick = (e) => { if(e.target === modal) stopVideo(); };

// Аудио-эффекты рулетки
let ac;function ctx(){return ac||(ac=new AudioContext())}
function tone(f,t,dur,type='square',v=.15){
  const a=ctx(),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime+t);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+dur);
  o.connect(g).connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+dur);
}
function tick(){tone(1400,0,.03,'triangle',.08)}
function fanfare(){
  [[523,0,.15],[523,.15,.15],[523,.3,.15],[659,.45,.4],[523,.85,.15],[659,1,.15],[784,1.15,.9]].forEach(([f,t,l])=>{
    tone(f,t,l,'sawtooth',.12);tone(f/2,t,l,'square',.06);
  });
}

// Конфетти
const c=document.getElementById('c'),x=c.getContext('2d');let parts=[];
function confetti(){
  c.width=innerWidth;c.height=innerHeight;const run=parts.length>0;
  for(let k=0;k<300;k++)parts.push({x:c.width/2,y:c.height/2,vx:(Math.random()-.5)*20,vy:Math.random()*-20-4,s:Math.random()*8+4,a:Math.random()*6,col:`hsl(${Math.random()*360},90%,60%)`});
  if(!run)anim();
}
function anim(){
  x.clearRect(0,0,c.width,c.height);
  parts.forEach(p=>{p.vy+=.4;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.col;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
  parts=parts.filter(p=>p.y<c.height+20);
  if(parts.length)requestAnimationFrame(anim);else x.clearRect(0,0,c.width,c.height);
}
</script>
</body>
</html>
